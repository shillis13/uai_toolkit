<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#bfdbfe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glassShadow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <clipPath id="glassClip">
      <rect x="195" y="195" width="634" height="490" rx="30"/>
    </clipPath>
  </defs>

  <!-- Background — light, clean -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgK)" stroke="#d6d3d1" stroke-width="2"/>

  <!-- Drop shadow of the pane -->
  <rect x="195" y="195" width="634" height="490" rx="30"
        fill="#000000" opacity="0.12" filter="url(#glassShadow)"
        transform="translate(8, 12)"/>

  <!-- The glass pane — the "single pane of glass" -->
  <rect x="195" y="195" width="634" height="490" rx="30"
        fill="url(#frameGrad)"/>

  <!-- Glass surface -->
  <rect x="207" y="207" width="610" height="466" rx="22"
        fill="url(#glassGrad)"/>

  <!-- Content visible through the glass — abstracted, diverse elements made uniform -->
  <g clip-path="url(#glassClip)" opacity="0.7">
    <!-- Row 1 -->
    <rect x="230" y="240" width="160" height="100" rx="12" fill="#292524" opacity="0.15"/>
    <rect x="240" y="250" width="100" height="8" rx="4" fill="#292524" opacity="0.25"/>
    <rect x="240" y="268" width="70" height="6" rx="3" fill="#292524" opacity="0.15"/>
    <rect x="240" y="300" width="130" height="6" rx="3" fill="#292524" opacity="0.1"/>
    <rect x="240" y="314" width="90" height="6" rx="3" fill="#292524" opacity="0.1"/>

    <rect x="410" y="240" width="160" height="100" rx="12" fill="#292524" opacity="0.15"/>
    <rect x="420" y="250" width="110" height="8" rx="4" fill="#292524" opacity="0.25"/>
    <rect x="420" y="268" width="80" height="6" rx="3" fill="#292524" opacity="0.15"/>
    <rect x="420" y="300" width="120" height="6" rx="3" fill="#292524" opacity="0.1"/>
    <rect x="420" y="314" width="100" height="6" rx="3" fill="#292524" opacity="0.1"/>

    <rect x="590" y="240" width="160" height="100" rx="12" fill="#292524" opacity="0.15"/>
    <rect x="600" y="250" width="90" height="8" rx="4" fill="#292524" opacity="0.25"/>
    <rect x="600" y="268" width="60" height="6" rx="3" fill="#292524" opacity="0.15"/>
    <rect x="600" y="300" width="110" height="6" rx="3" fill="#292524" opacity="0.1"/>

    <!-- Row 2 -->
    <rect x="230" y="360" width="240" height="100" rx="12" fill="#292524" opacity="0.15"/>
    <rect x="240" y="370" width="140" height="8" rx="4" fill="#292524" opacity="0.25"/>
    <rect x="240" y="388" width="200" height="6" rx="3" fill="#292524" opacity="0.12"/>
    <rect x="240" y="402" width="160" height="6" rx="3" fill="#292524" opacity="0.08"/>

    <rect x="490" y="360" width="260" height="100" rx="12" fill="#292524" opacity="0.15"/>
    <rect x="500" y="370" width="120" height="8" rx="4" fill="#292524" opacity="0.25"/>
    <rect x="500" y="388" width="180" height="6" rx="3" fill="#292524" opacity="0.12"/>

    <!-- Row 3 — partial -->
    <rect x="230" y="480" width="520" height="80" rx="12" fill="#292524" opacity="0.1"/>
    <rect x="240" y="490" width="200" height="8" rx="4" fill="#292524" opacity="0.2"/>
    <rect x="240" y="508" width="300" height="6" rx="3" fill="#292524" opacity="0.1"/>
  </g>

  <!-- Glass highlight — reflection streak -->
  <line x1="220" y1="220" x2="400" y2="220" stroke="#ffffff" stroke-width="4" rx="2" opacity="0.5" stroke-linecap="round"/>

  <!-- Handle — extending below the pane like a magnifying glass or paddle -->
  <rect x="488" y="685" width="48" height="180" rx="24" fill="url(#frameGrad)"/>
  <rect x="494" y="690" width="12" height="170" rx="6" fill="#44403c" opacity="0.3"/>
</svg>
