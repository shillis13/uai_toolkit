<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="blade1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="blade2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="0.5" cy="0.5" r="0.15">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensFlare" cx="0.5" cy="0.5" r="0.3">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <clipPath id="iconClipG">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background — near black -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgG)" stroke="#27272a" stroke-width="2"/>

  <g clip-path="url(#iconClipG)">
    <!-- Aperture blades — 6 curved blades forming an iris -->
    <!-- Each blade is a curved trapezoid, rotated around center -->

    <!-- Blade 1 — 0deg -->
    <g transform="rotate(0, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade1)" opacity="0.7"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- Blade 2 — 60deg -->
    <g transform="rotate(60, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade2)" opacity="0.55"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#d4d4d8" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- Blade 3 — 120deg -->
    <g transform="rotate(120, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade1)" opacity="0.65"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.25"/>
    </g>

    <!-- Blade 4 — 180deg -->
    <g transform="rotate(180, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade2)" opacity="0.6"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#d4d4d8" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- Blade 5 — 240deg -->
    <g transform="rotate(240, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade1)" opacity="0.7"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- Blade 6 — 300deg -->
    <g transform="rotate(300, 512, 500)">
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="url(#blade2)" opacity="0.55"/>
      <path d="M 512 200 L 620 280 L 570 420 L 460 380 Z" fill="none" stroke="#d4d4d8" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- Outer ring -->
    <circle cx="512" cy="500" r="280" fill="none" stroke="#3f3f46" stroke-width="12"/>
    <circle cx="512" cy="500" r="280" fill="none" stroke="#52525b" stroke-width="4"/>

    <!-- Center opening glow -->
    <circle cx="512" cy="500" r="100" fill="#fbbf24" opacity="0.08" filter="url(#glowG)"/>
    <circle cx="512" cy="500" r="60" fill="url(#centerLight)" opacity="0.9"/>
    <circle cx="512" cy="500" r="90" fill="url(#lensFlare)"/>

    <!-- Bright center point -->
    <circle cx="512" cy="500" r="18" fill="#fef3c7" opacity="0.95"/>
    <circle cx="512" cy="500" r="8" fill="#ffffff"/>
  </g>
</svg>
