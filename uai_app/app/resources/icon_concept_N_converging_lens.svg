<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lensRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="0.45" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#1e3a5f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="rayGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="focusGlow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clipN">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
    <clipPath id="lensInside">
      <ellipse cx="512" cy="480" rx="220" ry="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgN)" stroke="#1e293b" stroke-width="2"/>

  <g clip-path="url(#clipN)">

    <!-- ===== SCATTERED ELEMENTS OUTSIDE — chaos, diversity ===== -->
    <!-- These are scattered, different sizes, different colors, unaligned -->

    <!-- Top-left cluster -->
    <rect x="80" y="100" width="60" height="40" rx="8" fill="#f59e0b" opacity="0.4" transform="rotate(-15, 110, 120)"/>
    <rect x="160" y="140" width="45" height="30" rx="6" fill="#a78bfa" opacity="0.35" transform="rotate(8, 182, 155)"/>
    <circle cx="120" cy="220" r="18" fill="#38bdf8" opacity="0.35"/>

    <!-- Top-right cluster -->
    <rect x="800" y="120" width="55" height="35" rx="8" fill="#fb7185" opacity="0.4" transform="rotate(12, 828, 138)"/>
    <rect x="870" y="200" width="50" height="45" rx="6" fill="#34d399" opacity="0.35" transform="rotate(-20, 895, 222)"/>
    <circle cx="780" cy="200" r="15" fill="#fbbf24" opacity="0.3"/>

    <!-- Bottom-left -->
    <rect x="100" y="700" width="50" height="50" rx="8" fill="#38bdf8" opacity="0.35" transform="rotate(25, 125, 725)"/>
    <rect x="60" y="600" width="40" height="55" rx="6" fill="#f59e0b" opacity="0.3" transform="rotate(-10, 80, 628)"/>
    <circle cx="180" cy="760" r="20" fill="#a78bfa" opacity="0.3"/>

    <!-- Bottom-right -->
    <rect x="830" y="680" width="60" height="38" rx="8" fill="#34d399" opacity="0.35" transform="rotate(-18, 860, 700)"/>
    <rect x="870" y="600" width="45" height="42" rx="6" fill="#fb7185" opacity="0.3" transform="rotate(15, 892, 621)"/>
    <circle cx="800" cy="760" r="16" fill="#38bdf8" opacity="0.3"/>

    <!-- ===== RAYS converging INTO the lens ===== -->
    <!-- From scattered elements toward the lens edge -->
    <line x1="110" y1="120" x2="340" y2="360" stroke="#f59e0b" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="182" y1="155" x2="360" y2="390" stroke="#a78bfa" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="120" y1="220" x2="330" y2="420" stroke="#38bdf8" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>

    <line x1="828" y1="138" x2="680" y2="340" stroke="#fb7185" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="895" y1="222" x2="700" y2="400" stroke="#34d399" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="780" y1="200" x2="670" y2="370" stroke="#fbbf24" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>

    <line x1="125" y1="725" x2="350" y2="600" stroke="#38bdf8" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="80" y1="628" x2="330" y2="540" stroke="#f59e0b" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="180" y1="760" x2="370" y2="620" stroke="#a78bfa" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>

    <line x1="860" y1="700" x2="680" y2="590" stroke="#34d399" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="892" y1="621" x2="690" y2="540" stroke="#fb7185" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>
    <line x1="800" y1="760" x2="660" y2="610" stroke="#38bdf8" stroke-width="3" opacity="0.2" filter="url(#rayGlow)"/>

    <!-- ===== THE LENS — center, the unifier ===== -->
    <!-- Lens body — tall oval/convex shape -->
    <ellipse cx="512" cy="480" rx="220" ry="280"
             fill="#0f172a" opacity="0.6"/>
    <ellipse cx="512" cy="480" rx="220" ry="280"
             fill="url(#lensGlass)"/>
    <!-- Lens rim -->
    <ellipse cx="512" cy="480" rx="220" ry="280"
             fill="none" stroke="url(#lensRim)" stroke-width="8"/>
    <!-- Inner rim highlight -->
    <ellipse cx="512" cy="480" rx="214" ry="274"
             fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>

    <!-- ===== UNIFIED CONTENT INSIDE THE LENS ===== -->
    <!-- Same elements but organized, aligned, standardized -->
    <g clip-path="url(#lensInside)">
      <!-- Clean grid of uniform cards — order from chaos -->
      <rect x="360" y="300" width="130" height="70" rx="10" fill="#f59e0b" opacity="0.55"/>
      <rect x="370" y="310" width="80" height="6" rx="3" fill="#fef3c7" opacity="0.5"/>
      <rect x="370" y="324" width="55" height="4" rx="2" fill="#fef3c7" opacity="0.3"/>

      <rect x="510" y="300" width="130" height="70" rx="10" fill="#a78bfa" opacity="0.55"/>
      <rect x="520" y="310" width="80" height="6" rx="3" fill="#ede9fe" opacity="0.5"/>
      <rect x="520" y="324" width="60" height="4" rx="2" fill="#ede9fe" opacity="0.3"/>

      <rect x="360" y="390" width="130" height="70" rx="10" fill="#38bdf8" opacity="0.55"/>
      <rect x="370" y="400" width="75" height="6" rx="3" fill="#e0f2fe" opacity="0.5"/>
      <rect x="370" y="414" width="50" height="4" rx="2" fill="#e0f2fe" opacity="0.3"/>

      <rect x="510" y="390" width="130" height="70" rx="10" fill="#34d399" opacity="0.55"/>
      <rect x="520" y="400" width="70" height="6" rx="3" fill="#d1fae5" opacity="0.5"/>
      <rect x="520" y="414" width="48" height="4" rx="2" fill="#d1fae5" opacity="0.3"/>

      <rect x="360" y="480" width="130" height="70" rx="10" fill="#fb7185" opacity="0.5"/>
      <rect x="370" y="490" width="82" height="6" rx="3" fill="#ffe4e6" opacity="0.5"/>
      <rect x="370" y="504" width="56" height="4" rx="2" fill="#ffe4e6" opacity="0.3"/>

      <rect x="510" y="480" width="130" height="70" rx="10" fill="#fbbf24" opacity="0.5"/>
      <rect x="520" y="490" width="68" height="6" rx="3" fill="#fef3c7" opacity="0.5"/>
      <rect x="520" y="504" width="45" height="4" rx="2" fill="#fef3c7" opacity="0.3"/>

      <rect x="360" y="570" width="130" height="70" rx="10" fill="#a78bfa" opacity="0.45"/>
      <rect x="510" y="570" width="130" height="70" rx="10" fill="#38bdf8" opacity="0.45"/>
    </g>

    <!-- Lens highlight reflection -->
    <ellipse cx="440" cy="350" rx="60" ry="80" fill="#ffffff" opacity="0.04"/>

    <!-- Focus point glow at center of lens -->
    <circle cx="512" cy="480" r="30" fill="#ffffff" opacity="0.06" filter="url(#focusGlow)"/>
  </g>
</svg>
