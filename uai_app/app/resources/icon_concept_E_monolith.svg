<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="portalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="portalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0c1426"/>
    </linearGradient>
    <filter id="portalGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="innerGlowE">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgE)" stroke="#2a2a4a" stroke-width="2"/>

  <!-- Outer glow of the archway -->
  <path d="M 330 750 L 330 380 C 330 250, 420 180, 512 180 C 604 180, 694 250, 694 380 L 694 750"
        stroke="url(#portalGrad)" stroke-width="80" fill="none" opacity="0.12" filter="url(#portalGlow)"
        stroke-linecap="round"/>

  <!-- The Archway / Portal — a bold U shape that reads as both "U" and a portal -->
  <path d="M 330 740 L 330 400 C 330 270, 410 195, 512 195 C 614 195, 694 270, 694 400 L 694 740"
        stroke="url(#portalGrad)" stroke-width="56" fill="none" opacity="0.95"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner bright edge -->
  <path d="M 330 740 L 330 400 C 330 270, 410 195, 512 195 C 614 195, 694 270, 694 400 L 694 740"
        stroke="#ffffff" stroke-width="6" fill="none" opacity="0.15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Portal interior — dark void with subtle glow -->
  <path d="M 370 740 L 370 410 C 370 300, 430 240, 512 240 C 594 240, 654 300, 654 410 L 654 740 Z"
        fill="url(#portalInner)" opacity="0.8"/>

  <!-- Interior glow — something alive inside -->
  <ellipse cx="512" cy="500" rx="100" ry="160" fill="#818cf8" opacity="0.06" filter="url(#innerGlowE)"/>
  <ellipse cx="512" cy="480" rx="50" ry="80" fill="#c084fc" opacity="0.08" filter="url(#innerGlowE)"/>

  <!-- Three horizontal bars inside the portal — representing sessions/terminals -->
  <rect x="410" y="400" width="204" height="10" rx="5" fill="#c084fc" opacity="0.35"/>
  <rect x="410" y="440" width="204" height="10" rx="5" fill="#60a5fa" opacity="0.3"/>
  <rect x="410" y="480" width="204" height="10" rx="5" fill="#34d399" opacity="0.25"/>

  <!-- A single bright point at the arch apex — the "AI" -->
  <circle cx="512" cy="195" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="512" cy="195" r="30" fill="#ffffff" opacity="0.12" filter="url(#portalGlow)"/>

  <!-- Floor reflection -->
  <rect x="330" y="748" width="364" height="6" rx="3" fill="url(#portalGrad)" opacity="0.3"/>
</svg>
