<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep navy to near-black -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>

    <!-- Gold gradient for the baton -->
    <linearGradient id="batonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d78e"/>
      <stop offset="30%" stop-color="#e8b830"/>
      <stop offset="60%" stop-color="#f5d78e"/>
      <stop offset="100%" stop-color="#c99a20"/>
    </linearGradient>

    <!-- Baton tip glow -->
    <radialGradient id="tipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f5d78e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5d78e" stop-opacity="0"/>
    </radialGradient>

    <!-- Arc glow filter -->
    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger arc glow for inner arcs -->
    <filter id="arcGlowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Baton shine filter -->
    <filter id="batonShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer ambient glow from tip -->
    <radialGradient id="ambientGlow" cx="0.37" cy="0.33" r="0.55">
      <stop offset="0%" stop-color="#1e3a6e" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#142952" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Sparkle filter -->
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded rect -->
    <clipPath id="clipBg">
      <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGrad)"/>

  <!-- Ambient light radiating from baton tip area -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#ambientGlow)"/>

  <g clip-path="url(#clipBg)">

    <!-- ===== CONCENTRIC ARCS radiating from baton tip (~380, 310) ===== -->
    <!-- The arcs sweep in a broad fan, suggesting waves of influence/control -->
    <!-- Each arc is a circular segment centered roughly above-left, fanning out below-right -->

    <!-- Arc set 1: Primary fan — upper-left to lower-right sweep from tip -->
    <!-- Arc 1 — innermost, warmest, brightest -->
    <path d="M 280,200 A 140,140 0 0,1 480,200"
          fill="none" stroke="#edd9a3" stroke-width="5" stroke-opacity="0.8"
          stroke-linecap="round" filter="url(#arcGlowStrong)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc 2 -->
    <path d="M 220,140 A 220,220 0 0,1 540,140"
          fill="none" stroke="#d4c494" stroke-width="4.5" stroke-opacity="0.65"
          stroke-linecap="round" filter="url(#arcGlowStrong)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc 3 -->
    <path d="M 160,80 A 300,300 0 0,1 600,80"
          fill="none" stroke="#b0c0d8" stroke-width="4" stroke-opacity="0.5"
          stroke-linecap="round" filter="url(#arcGlow)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc 4 -->
    <path d="M 100,20 A 380,380 0 0,1 660,20"
          fill="none" stroke="#90a8c4" stroke-width="3.5" stroke-opacity="0.35"
          stroke-linecap="round" filter="url(#arcGlow)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc 5 — outermost, cool silver, faintest -->
    <path d="M 40,-40 A 460,460 0 0,1 720,-40"
          fill="none" stroke="#7090b0" stroke-width="3" stroke-opacity="0.22"
          stroke-linecap="round" filter="url(#arcGlow)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc 6 — very faint outer edge -->
    <path d="M -20,-100 A 540,540 0 0,1 780,-100"
          fill="none" stroke="#607898" stroke-width="2.5" stroke-opacity="0.12"
          stroke-linecap="round" filter="url(#arcGlow)"
          transform="rotate(-20, 380, 310)"/>

    <!-- Arc set 2: Secondary fan sweeping downward-right from tip -->
    <path d="M 430,380 A 130,130 0 0,1 490,520"
          fill="none" stroke="#edd9a3" stroke-width="4" stroke-opacity="0.55"
          stroke-linecap="round" filter="url(#arcGlowStrong)"/>

    <path d="M 460,360 A 200,200 0 0,1 545,570"
          fill="none" stroke="#c4cfe0" stroke-width="3.5" stroke-opacity="0.4"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <path d="M 490,340 A 270,270 0 0,1 600,620"
          fill="none" stroke="#a0b5cc" stroke-width="3" stroke-opacity="0.28"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <path d="M 520,320 A 340,340 0 0,1 660,670"
          fill="none" stroke="#8099b4" stroke-width="2.5" stroke-opacity="0.18"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <!-- Arc set 3: Tertiary fan sweeping downward-left from tip -->
    <path d="M 325,380 A 130,130 0 0,0 270,520"
          fill="none" stroke="#edd9a3" stroke-width="3.5" stroke-opacity="0.4"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <path d="M 300,360 A 200,200 0 0,0 215,570"
          fill="none" stroke="#c4cfe0" stroke-width="3" stroke-opacity="0.28"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <path d="M 275,340 A 270,270 0 0,0 160,620"
          fill="none" stroke="#a0b5cc" stroke-width="2.5" stroke-opacity="0.18"
          stroke-linecap="round" filter="url(#arcGlow)"/>

    <!-- Faint horizontal influence lines across the lower portion — abstract "reach" -->
    <line x1="140" y1="620" x2="880" y2="620" stroke="#3a5070" stroke-width="1" opacity="0.2"/>
    <line x1="180" y1="690" x2="840" y2="690" stroke="#3a5070" stroke-width="1" opacity="0.15"/>
    <line x1="220" y1="760" x2="800" y2="760" stroke="#3a5070" stroke-width="1" opacity="0.1"/>
    <line x1="260" y1="830" x2="760" y2="830" stroke="#3a5070" stroke-width="1" opacity="0.07"/>

    <!-- Small abstract "agent" dots responding to the arcs — aligned on the influence lines -->
    <circle cx="300" cy="620" r="8" fill="#5b9bd5" opacity="0.5"/>
    <circle cx="450" cy="620" r="8" fill="#7bc47f" opacity="0.5"/>
    <circle cx="570" cy="620" r="8" fill="#d4a05a" opacity="0.5"/>
    <circle cx="720" cy="620" r="8" fill="#c47bb0" opacity="0.5"/>

    <circle cx="350" cy="690" r="6" fill="#5bc4c4" opacity="0.35"/>
    <circle cx="500" cy="690" r="6" fill="#b47bc4" opacity="0.35"/>
    <circle cx="650" cy="690" r="6" fill="#c4a05b" opacity="0.35"/>

    <circle cx="400" cy="760" r="5" fill="#5b80c4" opacity="0.25"/>
    <circle cx="550" cy="760" r="5" fill="#80c45b" opacity="0.25"/>

    <!-- ===== THE BATON ===== -->
    <!-- Main shaft — elegant diagonal from lower-right grip to upper-left tip -->
    <line x1="700" y1="760" x2="390" y2="320"
          stroke="url(#batonGrad)" stroke-width="13" stroke-linecap="round"
          filter="url(#batonShine)"/>

    <!-- Specular highlight along shaft -->
    <line x1="690" y1="750" x2="400" y2="330"
          stroke="#fff8e0" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>

    <!-- Grip area — slightly thicker, darker gold base -->
    <line x1="718" y1="782" x2="680" y2="738"
          stroke="#b8860b" stroke-width="20" stroke-linecap="round"/>
    <line x1="718" y1="782" x2="680" y2="738"
          stroke="#d4a020" stroke-width="12" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Grip ring -->
    <ellipse cx="699" cy="760" rx="13" ry="5"
             fill="none" stroke="#f0d070" stroke-width="2" stroke-opacity="0.6"
             transform="rotate(-50, 699, 760)"/>

    <!-- Baton tip — refined bright point -->
    <circle cx="380" cy="310" r="10" fill="#fff8e0" filter="url(#sparkle)"/>
    <circle cx="380" cy="310" r="5" fill="#ffffff"/>

    <!-- Tip glow — large soft radiance -->
    <circle cx="380" cy="310" r="90" fill="url(#tipGlow)" opacity="0.6"/>
    <circle cx="380" cy="310" r="50" fill="url(#tipGlow)" opacity="0.3"/>

    <!-- Small sparkle particles near tip -->
    <circle cx="340" cy="270" r="2.5" fill="#fff8e0" opacity="0.7" filter="url(#sparkle)"/>
    <circle cx="420" cy="268" r="2" fill="#fff8e0" opacity="0.6" filter="url(#sparkle)"/>
    <circle cx="330" cy="320" r="2" fill="#e8d5a8" opacity="0.5" filter="url(#sparkle)"/>
    <circle cx="410" cy="350" r="2.5" fill="#fff8e0" opacity="0.55" filter="url(#sparkle)"/>
    <circle cx="355" cy="260" r="1.5" fill="#ffffff" opacity="0.8" filter="url(#sparkle)"/>
    <circle cx="440" cy="295" r="1.5" fill="#e8d5a8" opacity="0.45" filter="url(#sparkle)"/>
    <circle cx="360" cy="350" r="2" fill="#fff8e0" opacity="0.5" filter="url(#sparkle)"/>

  </g>
</svg>