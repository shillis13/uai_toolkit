<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgM2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <linearGradient id="batonM2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="tipGlowM2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="arcGlowM2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softM2">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <clipPath id="clipM2">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgM2)" stroke="#1a2744" stroke-width="2"/>

  <g clip-path="url(#clipM2)">

    <!-- Ambient glow from baton tip area -->
    <circle cx="380" cy="320" r="250" fill="#fbbf24" opacity="0.03" filter="url(#softM2)"/>

    <!-- ===== ORCHESTRATION ARCS — radiating from baton tip ===== -->
    <!-- Primary arc fan — sweeping upward and outward -->

    <!-- Arc 1 — closest, warmest -->
    <path d="M 300 240 A 110 110 0 0 1 460 240"
          fill="none" stroke="#fde68a" stroke-width="4.5" opacity="0.7"
          stroke-linecap="round" filter="url(#arcGlowM2)"
          transform="rotate(-15, 380, 320)"/>

    <!-- Arc 2 -->
    <path d="M 250 190 A 180 180 0 0 1 510 190"
          fill="none" stroke="#e2c97a" stroke-width="4" opacity="0.55"
          stroke-linecap="round" filter="url(#arcGlowM2)"
          transform="rotate(-15, 380, 320)"/>

    <!-- Arc 3 -->
    <path d="M 200 140 A 250 250 0 0 1 560 140"
          fill="none" stroke="#b8c8dc" stroke-width="3.5" opacity="0.4"
          stroke-linecap="round" filter="url(#arcGlowM2)"
          transform="rotate(-15, 380, 320)"/>

    <!-- Arc 4 -->
    <path d="M 150 90 A 320 320 0 0 1 610 90"
          fill="none" stroke="#90a8c4" stroke-width="3" opacity="0.28"
          stroke-linecap="round" filter="url(#arcGlowM2)"
          transform="rotate(-15, 380, 320)"/>

    <!-- Arc 5 — outermost -->
    <path d="M 100 40 A 390 390 0 0 1 660 40"
          fill="none" stroke="#708ca8" stroke-width="2.5" opacity="0.16"
          stroke-linecap="round" filter="url(#arcGlowM2)"
          transform="rotate(-15, 380, 320)"/>

    <!-- Secondary arcs — sweeping down-right from tip -->
    <path d="M 420 370 A 120 120 0 0 1 480 500"
          fill="none" stroke="#e2c97a" stroke-width="3.5" opacity="0.4"
          stroke-linecap="round" filter="url(#arcGlowM2)"/>

    <path d="M 450 355 A 190 190 0 0 1 530 560"
          fill="none" stroke="#a0b5cc" stroke-width="3" opacity="0.28"
          stroke-linecap="round" filter="url(#arcGlowM2)"/>

    <path d="M 475 340 A 260 260 0 0 1 585 620"
          fill="none" stroke="#8099b4" stroke-width="2.5" opacity="0.18"
          stroke-linecap="round" filter="url(#arcGlowM2)"/>

    <!-- Tertiary arcs — sweeping down-left -->
    <path d="M 340 370 A 120 120 0 0 0 280 500"
          fill="none" stroke="#e2c97a" stroke-width="3" opacity="0.3"
          stroke-linecap="round" filter="url(#arcGlowM2)"/>

    <path d="M 315 355 A 190 190 0 0 0 230 560"
          fill="none" stroke="#a0b5cc" stroke-width="2.5" opacity="0.2"
          stroke-linecap="round" filter="url(#arcGlowM2)"/>

    <!-- ===== AGENT ENTITIES below — responding to the conductor ===== -->
    <!-- Faint stage lines -->
    <line x1="140" y1="660" x2="880" y2="660" stroke="#1e3050" stroke-width="1.5" opacity="0.35"/>
    <line x1="170" y1="730" x2="850" y2="730" stroke="#1e3050" stroke-width="1" opacity="0.25"/>
    <line x1="200" y1="800" x2="820" y2="800" stroke="#1e3050" stroke-width="1" opacity="0.15"/>

    <!-- Agent dots — varied colors, different sizes suggesting different platforms -->
    <!-- Front row -->
    <circle cx="240" cy="660" r="14" fill="#f97316" opacity="0.6"/>
    <circle cx="240" cy="660" r="14" fill="none" stroke="#f97316" stroke-width="2" opacity="0.3"/>

    <circle cx="380" cy="660" r="14" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="380" cy="660" r="14" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>

    <circle cx="520" cy="660" r="14" fill="#3b82f6" opacity="0.6"/>
    <circle cx="520" cy="660" r="14" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>

    <circle cx="660" cy="660" r="14" fill="#10b981" opacity="0.6"/>
    <circle cx="660" cy="660" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>

    <circle cx="780" cy="660" r="14" fill="#ec4899" opacity="0.6"/>
    <circle cx="780" cy="660" r="14" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.3"/>

    <!-- Second row — smaller -->
    <circle cx="310" cy="730" r="10" fill="#f59e0b" opacity="0.4"/>
    <circle cx="450" cy="730" r="10" fill="#6366f1" opacity="0.4"/>
    <circle cx="590" cy="730" r="10" fill="#06b6d4" opacity="0.4"/>
    <circle cx="720" cy="730" r="10" fill="#f43f5e" opacity="0.4"/>

    <!-- Third row — smallest, faintest -->
    <circle cx="380" cy="800" r="7" fill="#a3a3a3" opacity="0.25"/>
    <circle cx="510" cy="800" r="7" fill="#a3a3a3" opacity="0.25"/>
    <circle cx="640" cy="800" r="7" fill="#a3a3a3" opacity="0.25"/>

    <!-- ===== THE BATON ===== -->
    <!-- Main shaft — diagonal from lower-right grip to upper-left tip -->
    <line x1="680" y1="620" x2="385" y2="325"
          stroke="url(#batonM2)" stroke-width="14" stroke-linecap="round"/>

    <!-- Baton highlight -->
    <line x1="675" y1="615" x2="390" y2="330"
          stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Grip ring -->
    <circle cx="672" cy="612" r="10" fill="none" stroke="#d97706" stroke-width="3.5"/>
    <circle cx="672" cy="612" r="5" fill="#d97706" opacity="0.5"/>

    <!-- Baton tip glow -->
    <circle cx="380" cy="320" r="50" fill="url(#tipGlowM2)"/>

    <!-- Bright tip point -->
    <circle cx="380" cy="320" r="10" fill="#fef3c7" opacity="0.95"/>
    <circle cx="380" cy="320" r="5" fill="#ffffff"/>

    <!-- Tiny sparkles near tip -->
    <circle cx="360" cy="298" r="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="402" cy="306" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="368" cy="342" r="1.5" fill="#ffffff" opacity="0.4"/>

  </g>
</svg>
