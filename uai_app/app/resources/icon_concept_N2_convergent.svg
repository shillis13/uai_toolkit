<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgN2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#cbd5e1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lensEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="lensHighlight" cx="0.4" cy="0.35" r="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlowN2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="iconShadow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="clipN2">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgN2)" stroke="#1e293b" stroke-width="2"/>

  <g clip-path="url(#clipN2)">

    <!-- ===== LEFT SIDE: Scattered real-world elements ===== -->

    <!-- Terminal window icon -->
    <g transform="translate(90, 140) rotate(-15)">
      <rect width="80" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
      <rect y="0" width="80" height="14" rx="8" fill="#f97316" opacity="0.8"/>
      <rect y="10" width="80" height="4" fill="#f97316" opacity="0.8"/>
      <text x="10" y="38" font-family="monospace" font-size="14" fill="#f97316" opacity="0.7">$_</text>
    </g>

    <!-- Chat bubble -->
    <g transform="translate(60, 320) rotate(8)">
      <rect width="70" height="45" rx="12" fill="#8b5cf6" opacity="0.8"/>
      <rect x="12" y="12" width="46" height="6" rx="3" fill="#c4b5fd" opacity="0.6"/>
      <rect x="12" y="24" width="30" height="6" rx="3" fill="#c4b5fd" opacity="0.4"/>
    </g>

    <!-- Code brackets -->
    <g transform="translate(130, 490) rotate(-10)">
      <text font-family="monospace" font-size="48" font-weight="bold" fill="#22d3ee" opacity="0.75">{ }</text>
    </g>

    <!-- AI sparkle/star -->
    <g transform="translate(80, 640)">
      <path d="M30 0 L36 20 L56 26 L36 32 L30 52 L24 32 L4 26 L24 20 Z"
            fill="#fbbf24" opacity="0.8"/>
    </g>

    <!-- Document/page icon -->
    <g transform="translate(150, 760) rotate(12)">
      <rect width="55" height="70" rx="6" fill="#334155" stroke="#60a5fa" stroke-width="2.5"/>
      <rect x="10" y="14" width="35" height="5" rx="2" fill="#60a5fa" opacity="0.4"/>
      <rect x="10" y="25" width="28" height="5" rx="2" fill="#60a5fa" opacity="0.3"/>
      <rect x="10" y="36" width="32" height="5" rx="2" fill="#60a5fa" opacity="0.2"/>
    </g>

    <!-- Web page icon -->
    <g transform="translate(50, 500) rotate(-5)">
      <rect width="65" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
      <rect y="0" width="65" height="12" rx="6" fill="#34d399" opacity="0.6"/>
      <rect y="9" width="65" height="3" fill="#34d399" opacity="0.6"/>
      <circle cx="10" cy="6" r="3" fill="#0f172a" opacity="0.5"/>
      <circle cx="20" cy="6" r="3" fill="#0f172a" opacity="0.5"/>
    </g>

    <!-- Brain/network node -->
    <g transform="translate(140, 260)">
      <circle r="22" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.7"/>
      <circle r="6" fill="#ec4899" opacity="0.6"/>
      <line x1="0" y1="-22" x2="0" y2="-10" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
      <line x1="18" y1="12" x2="8" y2="4" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
      <line x1="-18" y1="12" x2="-8" y2="4" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- Scattered small elements -->
    <circle cx="180" cy="180" r="5" fill="#f97316" opacity="0.4"/>
    <circle cx="110" cy="430" r="4" fill="#a855f7" opacity="0.35"/>
    <rect x="165" cy="580" width="8" height="8" rx="2" fill="#22d3ee" opacity="0.3" transform="rotate(45, 169, 584)"/>
    <circle cx="90" cy="720" r="3" fill="#fbbf24" opacity="0.3"/>

    <!-- ===== CONVERGENCE RAYS (dashed, from elements to lens) ===== -->
    <line x1="130" y1="170" x2="390" y2="430" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="95" y1="345" x2="390" y2="460" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="155" y1="510" x2="390" y2="490" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="105" y1="665" x2="390" y2="520" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="178" y1="790" x2="390" y2="560" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="80" y1="525" x2="390" y2="500" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
    <line x1="155" y1="280" x2="390" y2="450" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

    <!-- ===== THE LENS — wider, more optical ===== -->
    <!-- Lens body: biconvex, wider/rounder than v1 -->
    <ellipse cx="460" cy="500" rx="90" ry="260" fill="url(#lensGlass)"/>

    <!-- Lens rim -->
    <ellipse cx="460" cy="500" rx="90" ry="260" fill="none" stroke="url(#lensEdge)" stroke-width="3.5" opacity="0.7"/>

    <!-- Inner highlight -->
    <ellipse cx="445" cy="440" rx="55" ry="140" fill="url(#lensHighlight)"/>

    <!-- Central bright band (focal plane) -->
    <ellipse cx="460" cy="500" rx="12" ry="120" fill="#ffffff" opacity="0.06"/>

    <!-- ===== RIGHT SIDE: Unified, ordered output ===== -->
    <!-- Clean uniform cards in a grid — all same size, evenly spaced -->
    <!-- 6x5 grid of rounded squares, subtle but clearly organized -->

    <!-- Row 1 -->
    <rect x="600" y="280" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="280" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="280" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="280" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="280" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 2 -->
    <rect x="600" y="328" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="328" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="328" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="328" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="328" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 3 -->
    <rect x="600" y="376" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="376" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="376" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="376" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="376" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 4 -->
    <rect x="600" y="424" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="424" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="424" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="424" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="424" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 5 -->
    <rect x="600" y="472" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="472" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="472" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="472" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="472" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 6 -->
    <rect x="600" y="520" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="520" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="520" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="520" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="520" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 7 -->
    <rect x="600" y="568" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="568" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="568" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="568" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="568" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Row 8 -->
    <rect x="600" y="616" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="660" y="616" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="720" y="616" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="616" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="616" width="48" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Subtle lines from lens to grid (focused output) -->
    <line x1="550" y1="440" x2="600" y2="400" stroke="#475569" stroke-width="1" opacity="0.15"/>
    <line x1="550" y1="480" x2="600" y2="470" stroke="#475569" stroke-width="1" opacity="0.15"/>
    <line x1="550" y1="520" x2="600" y2="540" stroke="#475569" stroke-width="1" opacity="0.15"/>
    <line x1="550" y1="560" x2="600" y2="610" stroke="#475569" stroke-width="1" opacity="0.15"/>

    <!-- Subtle content lines inside a few output cards to show uniformity -->
    <rect x="608" y="290" width="24" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="608" y="296" width="16" height="3" rx="1" fill="#94a3b8" opacity="0.2"/>
    <rect x="668" y="338" width="24" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="668" y="344" width="18" height="3" rx="1" fill="#94a3b8" opacity="0.2"/>
    <rect x="728" y="386" width="22" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="788" y="434" width="26" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>
    <rect x="848" y="482" width="20" height="3" rx="1" fill="#94a3b8" opacity="0.3"/>

  </g>
</svg>
