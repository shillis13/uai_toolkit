<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <linearGradient id="prismFaceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="prismFaceR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="prismTop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="outputBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamGlowP">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softP">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="clipP">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgP)" stroke="#1a1a30" stroke-width="2"/>

  <g clip-path="url(#clipP)">

    <!-- ===== INCOMING DIVERSE RAYS — left side, many colors ===== -->
    <!-- Scattered, different angles — the chaos of diverse AI agents -->

    <!-- Each ray enters from the left and hits the left face of the prism -->
    <line x1="40" y1="250" x2="340" y2="400" stroke="#f59e0b" stroke-width="10" opacity="0.7" filter="url(#beamGlowP)"/>
    <line x1="40" y1="250" x2="340" y2="400" stroke="#f59e0b" stroke-width="24" opacity="0.06"/>

    <line x1="40" y1="370" x2="350" y2="440" stroke="#a78bfa" stroke-width="10" opacity="0.7" filter="url(#beamGlowP)"/>
    <line x1="40" y1="370" x2="350" y2="440" stroke="#a78bfa" stroke-width="24" opacity="0.06"/>

    <line x1="40" y1="490" x2="355" y2="480" stroke="#38bdf8" stroke-width="10" opacity="0.7" filter="url(#beamGlowP)"/>
    <line x1="40" y1="490" x2="355" y2="480" stroke="#38bdf8" stroke-width="24" opacity="0.06"/>

    <line x1="40" y1="610" x2="360" y2="530" stroke="#34d399" stroke-width="10" opacity="0.65" filter="url(#beamGlowP)"/>
    <line x1="40" y1="610" x2="360" y2="530" stroke="#34d399" stroke-width="24" opacity="0.06"/>

    <line x1="40" y1="720" x2="368" y2="575" stroke="#fb7185" stroke-width="10" opacity="0.6" filter="url(#beamGlowP)"/>
    <line x1="40" y1="720" x2="368" y2="575" stroke="#fb7185" stroke-width="24" opacity="0.06"/>

    <!-- ===== THE PRISM — center, triangular ===== -->
    <!-- Classic triangular prism, slightly rotated for dynamism -->

    <!-- Prism glow -->
    <polygon points="512,180 380,700 700,700"
             fill="#94a3b8" opacity="0.03" filter="url(#softP)"/>

    <!-- Left face (input side) -->
    <polygon points="512,180 380,700 512,650"
             fill="url(#prismFaceL)" opacity="0.9"/>

    <!-- Right face (output side) -->
    <polygon points="512,180 700,700 512,650"
             fill="url(#prismFaceR)" opacity="0.9"/>

    <!-- Top highlight -->
    <polygon points="512,180 460,360 564,360"
             fill="url(#prismTop)" opacity="0.15"/>

    <!-- Prism edges -->
    <polygon points="512,180 380,700 700,700"
             fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.5"/>
    <!-- Center crease -->
    <line x1="512" y1="180" x2="512" y2="650" stroke="#64748b" stroke-width="1.5" opacity="0.3"/>

    <!-- Internal refraction hint — subtle color mixing inside -->
    <polygon points="480,400 544,400 530,550 490,550"
             fill="#c084fc" opacity="0.06"/>

    <!-- ===== OUTPUT — single unified beam, right side ===== -->
    <!-- One coherent, bright, white/silver beam exits the right face -->

    <!-- Beam glow -->
    <polygon points="620,400 980,320 980,520 640,520"
             fill="#f1f5f9" opacity="0.04" filter="url(#softP)"/>

    <!-- Main beam -->
    <polygon points="630,420 980,380 980,470 645,490"
             fill="url(#outputBeam)" opacity="0.5"/>

    <!-- Beam core — brightest line -->
    <line x1="638" y1="455" x2="980" y2="430"
          stroke="#ffffff" stroke-width="8" opacity="0.6" stroke-linecap="round"
          filter="url(#beamGlowP)"/>
    <line x1="638" y1="455" x2="980" y2="430"
          stroke="#ffffff" stroke-width="3" opacity="0.8" stroke-linecap="round"/>

    <!-- Exit point glow on prism face -->
    <circle cx="638" cy="455" r="15" fill="#ffffff" opacity="0.2" filter="url(#softP)"/>
    <circle cx="638" cy="455" r="6" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
