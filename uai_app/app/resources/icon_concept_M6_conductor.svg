<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgM6" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <radialGradient id="tipGlowM6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientM6" cx="0.35" cy="0.27" r="0.5">
      <stop offset="0%" stop-color="#1e3a6e" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#142952" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaftM6" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="arcGlowM6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlowM6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softM6">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="clipM6">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgM6)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#ambientM6)"/>

  <g clip-path="url(#clipM6)">

    <!-- Baton tip is at (340, 270). All arcs centered exactly there. -->

    <!-- ===== CONCENTRIC ARCS centered on baton tip ===== -->
    <circle cx="340" cy="270" r="90" fill="none" stroke="#fde68a" stroke-width="4.5"
            opacity="0.55" filter="url(#strongGlowM6)"/>
    <circle cx="340" cy="270" r="160" fill="none" stroke="#e2c97a" stroke-width="4"
            opacity="0.42" filter="url(#arcGlowM6)"/>
    <circle cx="340" cy="270" r="240" fill="none" stroke="#b0c0d8" stroke-width="3.5"
            opacity="0.28" filter="url(#arcGlowM6)"/>
    <circle cx="340" cy="270" r="330" fill="none" stroke="#90a8c4" stroke-width="2.5"
            opacity="0.17" filter="url(#arcGlowM6)"/>
    <circle cx="340" cy="270" r="430" fill="none" stroke="#708ca8" stroke-width="2"
            opacity="0.09" filter="url(#arcGlowM6)"/>

    <!-- ===== PLATFORM ICONS on the arcs ===== -->

    <!-- CLAUDE — orange 6-pointed sparkle, on arc 2, upper-left -->
    <g transform="translate(200, 180)" opacity="0.8">
      <circle cx="0" cy="0" r="40" fill="#e07a4a" opacity="0.12" filter="url(#iconGlow)"/>
      <g transform="translate(-36, -36) scale(3)">
        <path d="M12 2C12 2 13.2 8.4 12 12C10.8 8.4 12 2 12 2ZM12 22C12 22 13.2 15.6 12 12C10.8 15.6 12 22 12 22ZM2 12C2 12 8.4 13.2 12 12C8.4 10.8 2 12 2 12ZM22 12C22 12 15.6 13.2 12 12C15.6 10.8 22 12 22 12ZM4.93 4.93C4.93 4.93 9.17 8.1 12 12C8.1 9.17 4.93 4.93 4.93 4.93ZM19.07 19.07C19.07 19.07 14.83 15.9 12 12C15.9 14.83 19.07 19.07 19.07 19.07ZM19.07 4.93C19.07 4.93 15.9 9.17 12 12C14.83 8.1 19.07 4.93 19.07 4.93ZM4.93 19.07C4.93 19.07 8.1 14.83 12 12C9.17 15.9 4.93 19.07 4.93 19.07Z"
              fill="#e07a4a"/>
      </g>
    </g>

    <!-- CODEX — purple hexagon with nucleus, on arc 2, right -->
    <g transform="translate(500, 195)" opacity="0.8">
      <circle cx="0" cy="0" r="40" fill="#8b5cf6" opacity="0.12" filter="url(#iconGlow)"/>
      <g transform="translate(-36, -36) scale(3)">
        <path d="M12 1.5L3 7v10l9 5.5L21 17V7l-9-5.5zm0 3L18 8v8l-6 3.5L6 16V8l6-3.5zm0 3.5a3 3 0 100 6 3 3 0 000-6z"
              fill="#8b5cf6"/>
      </g>
    </g>

    <!-- GEMINI — blue 4-point star, on arc 2, lower-left -->
    <g transform="translate(205, 410)" opacity="0.8">
      <circle cx="0" cy="0" r="40" fill="#4285f4" opacity="0.12" filter="url(#iconGlow)"/>
      <g transform="translate(-36, -36) scale(3)">
        <path d="M12 2C12 7.5 7.5 12 2 12c5.5 0 10 4.5 10 10 0-5.5 4.5-10 10-10-5.5 0-10-4.5-10-10z"
              fill="#4285f4"/>
      </g>
    </g>

    <!-- Additional CLAUDE — on arc 3, lower -->
    <g transform="translate(150, 540)" opacity="0.5">
      <g transform="translate(-26, -26) scale(2.2)">
        <path d="M12 2C12 2 13.2 8.4 12 12C10.8 8.4 12 2 12 2ZM12 22C12 22 13.2 15.6 12 12C10.8 15.6 12 22 12 22ZM2 12C2 12 8.4 13.2 12 12C8.4 10.8 2 12 2 12ZM22 12C22 12 15.6 13.2 12 12C15.6 10.8 22 12 22 12ZM4.93 4.93C4.93 4.93 9.17 8.1 12 12C8.1 9.17 4.93 4.93 4.93 4.93ZM19.07 19.07C19.07 19.07 14.83 15.9 12 12C15.9 14.83 19.07 19.07 19.07 19.07ZM19.07 4.93C19.07 4.93 15.9 9.17 12 12C14.83 8.1 19.07 4.93 19.07 4.93ZM4.93 19.07C4.93 19.07 8.1 14.83 12 12C9.17 15.9 4.93 19.07 4.93 19.07Z"
              fill="#e07a4a"/>
      </g>
    </g>

    <!-- Additional GEMINI — on arc 3, upper-right -->
    <g transform="translate(580, 310)" opacity="0.5">
      <g transform="translate(-26, -26) scale(2.2)">
        <path d="M12 2C12 7.5 7.5 12 2 12c5.5 0 10 4.5 10 10 0-5.5 4.5-10 10-10-5.5 0-10-4.5-10-10z"
              fill="#4285f4"/>
      </g>
    </g>

    <!-- Additional CODEX — on arc 3, bottom -->
    <g transform="translate(420, 520)" opacity="0.5">
      <g transform="translate(-26, -26) scale(2.2)">
        <path d="M12 1.5L3 7v10l9 5.5L21 17V7l-9-5.5zm0 3L18 8v8l-6 3.5L6 16V8l6-3.5zm0 3.5a3 3 0 100 6 3 3 0 000-6z"
              fill="#8b5cf6"/>
      </g>
    </g>

    <!-- Outer orbit — smaller platform icons for depth -->
    <g transform="translate(90, 170)" opacity="0.25">
      <g transform="translate(-18, -18) scale(1.5)">
        <path d="M12 2C12 7.5 7.5 12 2 12c5.5 0 10 4.5 10 10 0-5.5 4.5-10 10-10-5.5 0-10-4.5-10-10z" fill="#4285f4"/>
      </g>
    </g>
    <g transform="translate(660, 150)" opacity="0.22">
      <g transform="translate(-18, -18) scale(1.5)">
        <path d="M12 2C12 2 13.2 8.4 12 12C10.8 8.4 12 2 12 2ZM12 22C12 22 13.2 15.6 12 12C10.8 15.6 12 22 12 22ZM2 12C2 12 8.4 13.2 12 12C8.4 10.8 2 12 2 12ZM22 12C22 12 15.6 13.2 12 12C15.6 10.8 22 12 22 12ZM4.93 4.93C4.93 4.93 9.17 8.1 12 12C8.1 9.17 4.93 4.93 4.93 4.93ZM19.07 19.07C19.07 19.07 14.83 15.9 12 12C15.9 14.83 19.07 19.07 19.07 19.07ZM19.07 4.93C19.07 4.93 15.9 9.17 12 12C14.83 8.1 19.07 4.93 19.07 4.93ZM4.93 19.07C4.93 19.07 8.1 14.83 12 12C9.17 15.9 4.93 19.07 4.93 19.07Z" fill="#e07a4a"/>
      </g>
    </g>
    <g transform="translate(80, 530)" opacity="0.2">
      <g transform="translate(-18, -18) scale(1.5)">
        <path d="M12 1.5L3 7v10l9 5.5L21 17V7l-9-5.5zm0 3L18 8v8l-6 3.5L6 16V8l6-3.5zm0 3.5a3 3 0 100 6 3 3 0 000-6z" fill="#8b5cf6"/>
      </g>
    </g>
    <circle cx="690" cy="500" r="8" fill="#94a3b8" opacity="0.15"/>
    <circle cx="340" cy="700" r="8" fill="#94a3b8" opacity="0.12"/>

    <!-- ===== THE BATON ===== -->

    <!-- Shaft shadow -->
    <polygon points="345,275 700,780 712,770 355,265"
             fill="#000000" opacity="0.15" filter="url(#softM6)"/>

    <!-- Shaft body — tapered from grip (bottom) to tip (top) -->
    <polygon points="334,264 344,256 714,774 700,784"
             fill="url(#shaftM6)"/>

    <!-- Shaft highlight -->
    <line x1="338" y1="260" x2="708" y2="778"
          stroke="#fef3c7" stroke-width="2.5" opacity="0.3"/>

    <!-- GRIP — large, close, bottom-right -->
    <circle cx="707" cy="779" r="22" fill="#92400e"/>
    <circle cx="707" cy="779" r="18" fill="#b45309" opacity="0.7"/>
    <circle cx="707" cy="779" r="22" fill="none" stroke="#d97706" stroke-width="3"/>
    <circle cx="707" cy="779" r="12" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5"/>

    <!-- ===== TIP — glowing, centered at (340, 270) ===== -->
    <!-- Glow centered exactly on tip -->
    <circle cx="340" cy="270" r="60" fill="url(#tipGlowM6)"/>

    <!-- Tip body -->
    <circle cx="340" cy="270" r="14" fill="#fbbf24" opacity="0.9"/>
    <circle cx="340" cy="270" r="14" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.5"/>
    <circle cx="338" cy="268" r="8" fill="#fef3c7" opacity="0.95"/>
    <circle cx="337" cy="267" r="4" fill="#ffffff"/>

    <!-- Sparkles near tip -->
    <circle cx="322" cy="254" r="2.5" fill="#ffffff" opacity="0.65"/>
    <circle cx="358" cy="260" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="330" cy="290" r="1.5" fill="#ffffff" opacity="0.4"/>

  </g>
</svg>
