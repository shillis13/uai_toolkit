<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="beamGlow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="iconClipI">
      <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background — deep blue gradient to black -->
  <rect x="12" y="12" width="1000" height="1000" rx="200" ry="200" fill="url(#bgI)" stroke="#1e3a5f" stroke-width="2"/>

  <g clip-path="url(#iconClipI)">
    <!-- Light beam — spreading from the beacon -->
    <polygon points="512,310 80,80 944,80"
             fill="url(#beamGlow)" opacity="0.5"/>
    <polygon points="512,310 120,12 200,12 480,280"
             fill="url(#beamLeft)" opacity="0.3"/>
    <polygon points="512,310 904,12 824,12 544,280"
             fill="url(#beamRight)" opacity="0.3"/>

    <!-- Light source glow -->
    <circle cx="512" cy="310" r="80" fill="#fbbf24" opacity="0.1" filter="url(#lightGlow)"/>
    <circle cx="512" cy="310" r="40" fill="#fde68a" opacity="0.2" filter="url(#lightGlow)"/>

    <!-- The beacon/tower — clean geometric -->
    <!-- Main tower body — tapered rectangle -->
    <polygon points="470,340 554,340 570,820 454,820"
             fill="url(#towerGrad)" opacity="0.9"/>

    <!-- Tower highlight edge -->
    <line x1="470" y1="340" x2="454" y2="820" stroke="#f1f5f9" stroke-width="2" opacity="0.4"/>

    <!-- Tower shadow edge -->
    <line x1="554" y1="340" x2="570" y2="820" stroke="#1e293b" stroke-width="2" opacity="0.5"/>

    <!-- Horizontal bands on tower -->
    <rect x="460" y="450" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.3"/>
    <rect x="458" y="550" width="106" height="6" rx="3" fill="#94a3b8" opacity="0.25"/>
    <rect x="456" y="650" width="112" height="6" rx="3" fill="#94a3b8" opacity="0.2"/>

    <!-- Lantern housing — the light at top -->
    <rect x="458" y="310" width="108" height="40" rx="8" fill="#334155"/>
    <rect x="462" y="314" width="100" height="32" rx="6" fill="#fbbf24" opacity="0.8"/>

    <!-- Bright light point -->
    <circle cx="512" cy="330" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="512" cy="330" r="6" fill="#ffffff"/>

    <!-- Base / ground -->
    <ellipse cx="512" cy="830" rx="160" ry="20" fill="#334155" opacity="0.4"/>

    <!-- Concentric signal rings radiating from beacon -->
    <circle cx="512" cy="330" r="120" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.15"/>
    <circle cx="512" cy="330" r="200" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.08"/>
    <circle cx="512" cy="330" r="300" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.04"/>
  </g>
</svg>
