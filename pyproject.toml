[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "uai-toolkit"
version = "0.1.0"
description = "Portable AI tooling — jsonl readers, hooks, and platform-agnostic helpers."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shawn Hillis" }]
dependencies = [
    # read_jsonl core is stdlib-only. tomli only needed for config on <3.11.
    "tomli; python_version < '3.11'",
    # guidance_cli/guidance_lib parse YAML content after install; fresh-box
    # role/trait lookup must work without requiring the optional MCP extra.
    "pyyaml>=6",
]

[project.optional-dependencies]
# Heavier features (archive/engram/REPL) and Windows shims, opt-in.
# httpx: optional per-feature LLM client; websockets/session tools; tqdm/progress.
full = ["psutil>=5.9", "httpx>=0.27", "websockets>=12", "tqdm>=4"]
dev = ["pytest>=7"]
# MCP servers (knowledge, ...) — the skill surface. Opt-in: pip install uai-toolkit[mcp]
mcp = ["mcp>=1.0", "jsonschema>=4"]
# PIL/pillow backs the image-dimension-check hook only. Guarded lazy import —
# absent, the hook skips the check rather than crashing. Opt-in.
images = ["pillow>=10"]

[project.scripts]
uai-toolkit = "uai_toolkit.install:main"
uai-mcp-knowledge = "uai_toolkit.mcp.knowledge.server:run"
uai-mcp-workflow = "uai_toolkit.mcp.workflow.server:run"
read_jsonl = "uai_toolkit.jsonl.read_jsonl:main"
# Multi-tool j-tools — each a real per-OS launcher (replaces the busybox symlinks).
jcat = "uai_toolkit.jsonl.catjsonl:jcat"
jgrep = "uai_toolkit.jsonl.catjsonl:jgrep"
jhead = "uai_toolkit.jsonl.catjsonl:jhead"
jtail = "uai_toolkit.jsonl.catjsonl:jtail"
jwc = "uai_toolkit.jsonl.catjsonl:jwc"
jfmt = "uai_toolkit.jsonl.catjsonl:jfmt"
# file_access anti-clobber hook handlers (wired by `uai-toolkit init`):
ai-fa-track-read = "uai_toolkit.file_access.hooks:track_read"
ai-fa-track-write = "uai_toolkit.file_access.hooks:track_write"
ai-fa-check-write = "uai_toolkit.file_access.hooks:check_before_write"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The knowledge base (ai_context_files) + composition layer (ai_profiles) ship
# as package data; `uai-toolkit install` copies them into AI_ROOT and builds the
# guidance index (context.db, via context_mgr reindex) from them on a fresh box.
# The endpoint JSON is an example only and is never loaded automatically.
# The YAML/JSON globs cover behavior/taxonomy configs loaded beside their Python
# consumers; without them installed hooks silently degrade or declare_stop fails.
"uai_toolkit" = ["py.typed", "content/**/*", "ai_env.sh", "**/*.md", "llm/*.json",
                 "hooks/handlers/**/*.yml", "hooks/handlers/**/*.json",
                 "session_mgmt/*.yml"]
