[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-toolkit"
version = "0.1.0"
description = "Portable AI tooling — jsonl readers, hooks, and platform-agnostic helpers."
requires-python = ">=3.10"
dependencies = [
    # read_jsonl core is stdlib-only. tomli only needed for config on <3.11.
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
# Heavier features (archive/engram/REPL) and Windows shims, opt-in.
full = ["psutil>=5.9"]
dev = ["pytest>=7"]

[project.scripts]
read_jsonl = "ai_toolkit.jsonl.read_jsonl:main"
# Multi-tool dispatch (jcat/jgrep/...) lands here as console_scripts too —
# each becomes a real per-OS launcher, no symlinks needed.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_toolkit" = ["py.typed"]
