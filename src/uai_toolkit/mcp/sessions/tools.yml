# NOTE (uai_toolkit): the sessions_local_llm entries are trimmed to the three
# tools this package implements. Upstream also declares server_start/stop/status,
# switch_model, the async reasoning pair and get_result — all of which drive a
# LOCAL model server / request queue that this package does not ship. Declaring
# them here would advertise tools the module cannot answer.
_meta:
  description: Tool definitions for sessions MCP server
  generated_from: existing tools() functions
  note: Edit this file to rename tools. The server reloads dynamically.
tools:
- name: sched_task_add
  description: 'Add a scheduled task (job) to an existing group and install it as a launchd agent immediately. SIDE EFFECT:
    auto-installs — the new agent is bootstrapped and will start firing on its schedule. This is the sanctioned way to create
    a scheduled task; do NOT hand-write launchd plists.'
  handler: sched_task_add
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
          Must already exist (use sched_task_create first if not).
      id:
        type: string
        description: Job id, unique within its group. A job is one scheduled task; it compiles to one launchd agent (com.shawnhillis.ai.<group>.<id>).
      schedule:
        type: string
        description: 'Schedule: a 5-field cron expression (minute hour day-of-month month day-of-week) or ''@reboot''. Supported
          subset: ''M H * * *'' (daily), ''M H * * D'' (weekly, D=0=Sun), ''*/N * * * *'' and ''M-59/N * * * *'' (every N
          min), ''* * * * *'' (every min), ''@reboot''. Unsupported forms (hourly ''M * * * *'', comma lists, hour ranges,
          day-of-month) are rejected — fail loud.'
      command:
        type: string
        description: Shell command to run on schedule. Runs via /bin/bash -lc, so $AI_ROOT and other env vars expand. For
          a long-running watcher use schedule '@reboot' (it becomes RunAtLoad+KeepAlive).
      log:
        type: string
        description: 'Absolute path for the task''s stdout+stderr log. Convention: $AI_ROOT/ai_general/logs/<group>/<id>.log.
          Optional but recommended.'
      description:
        type: string
        description: Human-readable description of what this task does (optional).
    required:
    - group
    - id
    - schedule
    - command
- name: sched_task_create
  description: Create a new, empty task group (a YAML file). Add jobs to it with sched_task_add. Use this when starting a
    new category of scheduled work. No launchd change until a job is added and installed.
  handler: sched_task_create
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: New group name. Lowercase letters, digits, '_' and '-' only. Becomes <group>.yml and the launchd label
          segment.
      description:
        type: string
        description: Human-readable description of what this group of tasks is for (optional).
    required:
    - group
- name: sched_task_delete
  description: 'DESTRUCTIVE: delete a job (or the whole group if id is omitted) and bootout its launchd agent(s). Removes
    the YAML entry and unloads the running agent. Not reversible except by re-creating the task.'
  handler: sched_task_delete
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
      id:
        type: string
        description: Job id to delete. OMIT to delete the ENTIRE group and all its jobs.
    required:
    - group
- name: sched_task_disable
  description: 'Disable a task group and bootout its agents (they stop firing) without deleting the definitions. SIDE EFFECT:
    unloads the group''s launchd agents; re-enable with sched_task_enable.'
  handler: sched_task_disable
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
    required:
    - group
- name: sched_task_edit
  description: 'Edit fields of an existing job, then auto-reinstall it. SIDE EFFECT: the job''s launchd agent is re-bootstrapped
    (a ~1s restart). Only the fields you pass are changed; omitted fields are left as-is.'
  handler: sched_task_edit
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
      id:
        type: string
        description: Job id, unique within its group. A job is one scheduled task; it compiles to one launchd agent (com.shawnhillis.ai.<group>.<id>).
      schedule:
        type: string
        description: New schedule (same format as add). Omit to leave unchanged.
      command:
        type: string
        description: New shell command. Omit to leave unchanged.
      log:
        type: string
        description: New log path. Omit to leave unchanged.
      description:
        type: string
        description: New description. Omit to leave unchanged.
    required:
    - group
    - id
- name: sched_task_enable
  description: 'Enable a previously-disabled task group and reinstall its agents (they start firing again). SIDE EFFECT: bootstraps
    the group''s agents.'
  handler: sched_task_enable
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
    required:
    - group
- name: sched_task_import
  description: Adopt a hand-installed launchd agent into a managed YAML task by reverse-engineering the YAML from its installed
    plist (label→group/job, schedule keys→cron, ProgramArguments→command, env/log). Writes/merges the YAML but does NOT install
    — review the result, then call sched_task_install to make it managed. Use this to fix 'drift' from an agent created outside
    this system.
  handler: sched_task_import
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      label:
        type: string
        description: Full launchd label of the installed agent, e.g. 'com.shawnhillis.ai.uai.build_watcher'. Get candidates
          from sched_task_status (sync.extra) or 'launchctl list'.
      dry_run:
        type: boolean
        default: false
        description: If true, print the YAML it would write without writing it.
    required:
    - label
- name: sched_task_install
  description: 'Sync all launchd agents to the current YAML definitions. Idempotent and content-aware: only NEW or CHANGED
    agents are re-bootstrapped; unchanged (incl. running KeepAlive) agents are left untouched. Removes managed agents whose
    YAML was deleted. Normally not needed (add/edit/etc auto-install) — use it to reconcile drift or after editing YAML files
    directly.'
  handler: sched_task_install
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      dry_run:
        type: boolean
        default: false
        description: If true, report what would be added/removed without changing anything.
- name: sched_task_list
  description: List all scheduled-task groups and the jobs in each. Read-only. Use this to discover what scheduled tasks exist
    before editing or running one.
  handler: sched_task_list
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      all:
        type: boolean
        default: false
        description: 'If true, include disabled groups (default: only enabled).'
- name: sched_task_logs
  description: Return the tail of a job's log file (the path set in its YAML). Read-only.
  handler: sched_task_logs
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
      id:
        type: string
        description: Job id, unique within its group. A job is one scheduled task; it compiles to one launchd agent (com.shawnhillis.ai.<group>.<id>).
      lines:
        type: integer
        default: 30
        description: Number of trailing log lines to return (default 30).
    required:
    - group
    - id
- name: sched_task_reinstall
  description: 'Force-reload exactly ONE group''s launchd agents, leaving every other group untouched. Unlike sched_task_install
    (which reconciles the whole set and skips unchanged agents), this boots out and re-bootstraps every job in the named group
    even if unchanged, and removes any of its agents whose job was deleted/disabled. Use it to kick a single group after editing
    its YAML directly, or to recover one wedged group without churning the fleet.'
  handler: sched_task_reinstall
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
      dry_run:
        type: boolean
        default: false
        description: If true, report which agents would be reloaded/removed without changing anything.
    required:
    - group
- name: sched_task_run
  description: Run a job's command immediately, once, in the foreground and wait for it (synchronous). Does NOT affect the
    schedule. Use to test a task or trigger an ad-hoc run. Output/exit status are returned.
  handler: sched_task_run
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
      id:
        type: string
        description: Job id, unique within its group. A job is one scheduled task; it compiles to one launchd agent (com.shawnhillis.ai.<group>.<id>).
    required:
    - group
    - id
- name: sched_task_status
  description: 'Structured JSON status of every scheduled task: per-job install state, last run (exit code + time), next fire
    time, and overall sync/drift (whether installed launchd agents match the YAML definitions). Read-only. The primary tool
    for ''are my scheduled tasks healthy / in sync?''.'
  handler: sched_task_status
  module: sched_tasks
  inputSchema:
    type: object
    properties: {}
- name: sched_task_view
  description: Show one group's jobs in detail (ids, schedules, commands, log paths, env). Read-only.
  handler: sched_task_view
  module: sched_tasks
  inputSchema:
    type: object
    properties:
      group:
        type: string
        description: Task group name = one YAML file in data/scheduled_tasks/. Holds related jobs (e.g. 'sysmon', 'news_scan').
    required:
    - group
