- name: context_check_resume
  description: 'Read-only PREFLIGHT: would this transcript survive `claude --resume`? Scans for the crash class where an offload
    stub flattened a list-typed attachment field (deferred_tools_delta.addedNames, hook_additional_context.content, ...) into
    a bare string — CC runs .map()/.join() over those on resume, so a flatten is fatal. Uses a verified field taxonomy PLUS
    self-calibration (a field seen as a list elsewhere but a bare stub here is a flatten), and — when a co-located <name>.jsonl.bak
    snapshot exists — the exact offload pre-write guard diffed against it. Returns {ok, standalone_violations, snapshot_diff}.
    Run before trusting a context_bounce.'
  handler: context_check_resume
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
    required:
    - session
- name: context_bounce
  description: 'Realize a lighter context: schedule a launchd self-resume in N minutes then /exit, so the session restarts
    and reloads its (now offloaded/consolidated) transcript fresh. This is the ''realize'' step after offload/consolidate.
    SAFE DEFAULT: dry_run=true prints the plan WITHOUT scheduling or exiting. self_restart reads AI_TRACKING_ID from its environment;
    this tool injects the session you pass as AI_TRACKING_ID for the child process.'
  handler: context_bounce
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Tracking id of the session to bounce (injected as AI_TRACKING_ID for self_restart.py). REQUIRED — must
          be a tracking id (YYYYMMDD_HHMMSS_uuid8_plat), not a path.
      in_min:
        type: integer
        default: 2
        description: Minutes until the scheduled self-resume (default 2).
      dry_run:
        type: boolean
        default: true
        description: If true (DEFAULT), print the plan and do NOT schedule or exit. Set false to actually schedule the bounce.
    required:
    - session
- name: declare_stop
  description: 'Declare WHY you are ending your turn, before you stop. Select one or more reason ids from the taxonomy (Stop/declare_stop.config.yml), plus optional per-reason params and a free-text note. Structured replacement for the heuristic stop-checkers: records your intent to session state for the Stop gate, the Live Board, and downstream effects. For a reason not in the taxonomy, pass no reasons and use note. Common ids: awaiting_user (default), more_work, finished_todo, need_decision, context_pressure, waiting_on, blocked, no_more_work, wake_me, break, switch_work, discuss_soonest.'
  handler: declare_stop
  module: declare_stop
  inputSchema:
    type: object
    properties:
      reasons:
        type: array
        items:
          type: string
        description: Taxonomy reason ids that apply. May be empty for a note-only custom stop.
      params:
        type: object
        description: Per-reason parameters, e.g. todo_id, after_min, pct, source.
      note:
        type: string
        description: Free-text note. Always allowed; REQUIRED if reasons is empty (a fully custom reason).
      checklist:
        type: object
        description: PREFERRED. Your end-of-turn self-review. Answer every field explicitly (no defaults).
        additionalProperties: false
        properties:
          addressed_prompt:
            type: boolean
            description: Did your response address what the prompt actually asked?
          logical:
            type: boolean
            description: Were your responses logical and internally consistent?
          claims_verified:
            type: boolean
            description: Are your factual claims verified / evidence-backed, not just asserted?
          did_what_i_said:
            type: boolean
            description: Did you do everything you said you would this turn (nothing said-but-skipped)?
          work_finished:
            type: boolean
            description: Is all work you touched finished and saved/committed (nothing half-done)?
          errors_handled:
            type: boolean
            description: Were any errors this turn resolved or flagged (none silently dropped)?
          asking_needless_question:
            type: boolean
            description: Are you asking the user something you could answer or move forward without?
          want_to_revisit:
            type: boolean
            description: Do you want a chance to re-think or revise your response before ending?
          more_work_now:
            type: boolean
            description: Is there more work you can start right now without new input?
          waiting_on:
            type: string
            description: If waiting on a person/response/dependency, what? Empty string if not waiting.
          told_to_stop:
            type: boolean
            description: Were you told to stop at this point?
          want_break:
            type: boolean
            description: Do you want to pause / take a break?
          want_switch:
            type: boolean
            description: Would you rather switch to different work?
          start_next_now:
            type: boolean
            description: Should the next turn start immediately?
          schedule_next_min:
            type: integer
            description: Schedule the next turn in N minutes (0 = do not schedule).
          note_to_user:
            type: string
            description: A note to send PianoMan now, or empty string.
          note_to_hamilton:
            type: string
            description: A note to send Hamilton now, or empty string.
        required:
        - addressed_prompt
        - logical
        - claims_verified
        - did_what_i_said
        - work_finished
        - errors_handled
        - asking_needless_question
        - want_to_revisit
        - more_work_now
        - waiting_on
        - told_to_stop
        - want_break
        - want_switch
        - start_next_now
        - schedule_next_min
        - note_to_user
        - note_to_hamilton
    required: []
