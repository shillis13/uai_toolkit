        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      summaries_file:
        type: string
        description: 'Path to a JSON file {first_uuid: summary} — one summary per range from context_summarize_plan (the
          Claude-quality path).'
      leaf:
        type: string
        description: Optional active-chain leaf UUID; REQUIRED on a forked transcript.
      keep_recent:
        type: integer
        description: 'Optional: number of recent turns to protect from Summarization.'
    required:
    - session
    - summaries_file
