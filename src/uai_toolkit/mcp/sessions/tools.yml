- name: sessions_read_session
  description: Read and parse terminal content from a CLI session. Returns structured messages (JSON), cleaned text, or raw
    dump. Use status_only=true for fast polling (<100ms) to detect permission prompts and session state.
  handler: sessions_read_session
  module: sessions_cli_agent
  inputSchema:
    type: object
    properties:
      session_id:
        type: string
        description: Zellij session name
      range:
        type: string
        default: all
        description: 'Line range: ''all'', ''start:N'', ''M:N'', ''N:end'''
      format:
        type: string
