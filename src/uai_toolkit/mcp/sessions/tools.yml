- name: context_stats
  description: 'Read-only context ledger for a session''s transcript: message/turn counts by type, tool usage, char/word/token
    totals, and the full/stub (offloaded) split. Use this to see how big a context is and where the weight lives before offloading
    or consolidating.'
  handler: context_stats
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      interval:
        type: string
        default: live
        description: 'Compaction interval to scope stats to: ''live'' (default, current live context since last compaction),
          ''last'', a number (0=prologue, 1..N), or a range like ''2-4''.'
    required:
    - session
- name: context_offload
  description: 'Lossless context paging: archive large tool-result / tool-input / attachment payloads out of the live transcript
    into a sidecar archive, leaving resume-safe stubs (reversible via context_rehydrate). Shrinks the live context without
    losing anything. SAFE DEFAULT: dry_run=true — a bare call previews what WOULD be paged out and mutates nothing.'
  handler: context_offload
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      dry_run:
        type: boolean
        default: true
        description: If true (DEFAULT), report what would be paged out without writing. Set false to actually offload.
      keep_last_turns:
        type: integer
        description: Human turns at the tail protected verbatim (never paged out). Script default is 5 if omitted.
      min_bytes:
        type: integer
        description: Only page out content whose on-wire size is >= this many bytes. Script default is 512 if omitted.
      stub_attachments:
        type: boolean
        default: true
        description: Whether to also page out large attachment records (deferred-tool deltas etc). Default true; pass false
          to send --no-stub-attachments and leave attachments in place.
      bounce:
        type: boolean
        default: false
        description: If true, after a successful (non-dry-run) offload, immediately self-bounce the session to REALIZE the
          reduction (schedule a launchd --resume + /exit). One deliberate action = offload + realize, so the decision to
          offload doesn't need a separate context_bounce step. Requires session to be a tracking_id (like context_bounce).
          Ignored when dry_run.
      bounce_in_min:
        type: integer
        default: 2
        description: Minutes until the scheduled self-resume when bounce=true (default 2).
    required:
    - session
- name: context_recall
  description: 'Recall (read-only): render the full original text of an archived engram (a Summarized / paged-out turn-range) by
    its engram id, without restoring it to the transcript. Use to ''remember'' offloaded content on demand.'
  handler: context_recall
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      engram_id:
        type: string
        description: Durable engram_id of the archived layer to render (from a stub's ENGRAM_META, or context_summarize_enact
          output).
      leaf:
        type: string
        description: Optional active-chain leaf UUID to disambiguate forks. Omit unless the transcript has diverged branches.
    required:
    - session
    - engram_id
- name: context_rehydrate
  description: 'Restore (UNDO): restore previously offloaded/Summarized content back into the live transcript on disk. If engram_id
    is given, undoes that one Summarization (memory_manager restore); otherwise restores ALL archived tool-result/attachment
    stubs (offload --rehydrate). Mutating.'
  handler: context_rehydrate
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      engram_id:
        type: string
        description: Optional. If given, Restore just this Summarized engram. Omit to restore all offloaded tool-result/attachment
          stubs.
    required:
    - session
- name: context_slim
  description: 'Shrink fat engram stubs: rewrite existing ENGRAM_META inline bodies[] from fat to slim form (manifest untouched,
    recall stays byte-exact). Reclaims live-context bytes held by verbose stubs. SAFE DEFAULT: dry_run=true previews what
    would be slimmed.'
  handler: context_slim
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      dry_run:
        type: boolean
        default: true
        description: If true (DEFAULT), report what would be slimmed without writing. Set false to actually slim.
    required:
    - session
- name: context_summarize_plan
  description: 'Summarization plan (read-only): recommend which turn-range(s) to Summarize to free the requested token budget,
    given current usage. Returns the plan (first_uuids to summarize) — no mutation. Feed the plan''s ranges into context_summarize_enact.'
  handler: context_summarize_plan
  module: context_ops
  inputSchema:
    type: object
    properties:
      session:
        type: string
        description: Session to act on. Accepts a direct .jsonl transcript path, a tracking id (YYYYMMDD_HHMMSS_uuid8_plat),
          a uai:// URI, a display name, or a CLI session UUID (prefix OK). REQUIRED — the server will NOT default to its own
          session (the MCP server env is not the calling agent's).
      used_pct:
        type: number
        description: Current context usage as a percentage 0-100 (NOT 0-1).
      need_tokens:
        type: integer
        description: Target number of tokens to free by Summarizing.
      leaf:
        type: string
        description: Optional active-chain leaf UUID; REQUIRED on a forked transcript so Summarization follows the right branch.
      keep_recent:
        type: integer
        description: 'Optional: number of recent turns to protect from Summarization.'
    required:
    - session
    - used_pct
    - need_tokens
- name: context_summarize_enact
  description: 'MUTATING: Summarize turn-range(s) into engram stubs using caller-supplied summaries. summaries_file is a
    JSON file mapping {first_uuid: summary_text} (produced from context_summarize_plan''s ranges, one summary per range).
    Reversible via context_rehydrate --engram-id (Restore). Skips the local-LLM shadow log.'
  handler: context_summarize_enact
  module: context_ops
  inputSchema:
    type: object
    properties:
