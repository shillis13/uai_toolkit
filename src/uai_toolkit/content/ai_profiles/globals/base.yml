  - path: ai_context_files/instructions/perspectives/perspective_operating_principles
    purpose: Core operating principles — partnership, communication, radical honesty
  - path: ai_context_files/instructions/perspectives/perspective_user_profile_for_cli_agents
    purpose: PianoMan profile — who we're working with
  knowledge:
