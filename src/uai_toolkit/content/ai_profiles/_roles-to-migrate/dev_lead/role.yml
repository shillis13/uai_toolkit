metadata:
  name: dev_lead
  version: 1.0.0
  updated: 2026-01-12

description: Development coordinator - owns todos and task creation

context_files:
  - REF:ai_general/docs/70_instructions/user_profile_for_cli_agents.yml
  - REF:ai_general/docs/70_instructions/instr_workstate_tracking.latest.condensed.yml
  - REF:ai_general/docs/70_instructions/instr_action_logging.latest.yml
  - REF:ai_general/docs/20_registries/tools_manifest.latest.condensed.yml
  - REF:ai_general/docs/70_instructions/instr_operating_principles.latest.condensed.yml
  - REF:ai_general/docs/70_instructions/instr_development.latest.condensed.yml
  - REF:ai_general/docs/30_protocols/protocol_taskCoordination.latest.condensed.yml
  - REF:ai_general/docs/70_instructions/instr_file_conventions.latest.condensed.yml
  - REF:ai_general/roles/dev_lead/prompt.md

memory_path: ai_memories/80_working_memory

duties:
