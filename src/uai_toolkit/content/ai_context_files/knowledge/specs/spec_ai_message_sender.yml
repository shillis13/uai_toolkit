meta: {v: 1.1.0, created: 2025-11-01, author: PianoMan, status: production}
location: comms MCP (mcp__comms) — backed by messaging scripts under ai_comms/

summary: Universal mechanism to deliver messages/prompts to CLI AI sessions (Claude Code, Codex CLI) via the comms MCP. Enables notifications, scheduled prompts, CLI alerts, cross-AI comms.

interface:
  tools: [comms_send_prompt, comms_message]
  params:
    recipient: {type: string, required: yes, note: "target session id / name"}
    message: {type: string, required: yes, note: "can be multi-line"}
  returns: {0: success, 1: error}

behavior:
  delivery: enqueues/injects the prompt into the target session via the comms bus
  input: written to the recipient session's prompt queue (no keystroke simulation)
  targeting: addressed by session id / name, not by active window focus
  concurrency: bus-serialized; safe for concurrent senders

use_cases: [system notifications, CLI completion alerts, scheduled prompts, cross-AI comms, async collaboration]

limitations: [delivery is fire-and-forget unless a wait/response tool is used, recipient must be a registered session]

related: [CLI Coordination Protocol, comms MCP scheduled prompts, session prompt delivery]
