metadata:
  title: Role Configuration Schema
  version: 2.0.0
  updated: 2026-06-22
  description: |
    Schema for an AI agent role (ai_profiles/roles/<id>.yml). A role is a named
    bundle of context files plus its responsibilities. Profiles compose multiple
    roles; a session loads profiles -> roles -> context files.

    v2.0 (todo_0319): renamed the `traits:` section to `context_files:`; references
    use ai_context_files/ paths (the ai_traits symlink was removed). The tiered
    `load_sequence` / optional-loading system is RETIRED — a role either loads a
    context file or it does not. No tiers, no demand/topic gating, no REF: prefix.

schema:
  name:
    type: string
    required: true
    description: Human-readable role name (e.g. Condenser, Worker, Researcher).

  description:
    type: string
    required: false
    description: One- or two-line statement of what the role does. Keep it lean.

  responsibilities:
    required: false
    fields:
      duties:
        type: list[duty]
        description: Scheduled/recurring responsibilities (name + schedule + action).
      ownership:
        type: list[string]
        description: What this role owns.
      does_not_own:
        type: list[string]
        description: Explicit exclusions (often another role's domain).

  duty:
    fields:
      name: {type: string, required: true}
      schedule: {type: string, required: false, description: "daily | weekly | on_demand | ..."}
      action: {type: string, required: true, description: What to do.}

  context_files:
    required: false
    description: |
      The context files this role bundles. Resolved to LATEST (no version pins).
      May be a flat list, OR a mapping whose values are lists (the keys are
      organizational only — the loader flattens all of them). Every referenced
      file is loaded when the role is loaded; there is no optional/lazy tier.
    type: list[string] | mapping[str, list[string]]
    item_format: "ai_context_files/<instructions|knowledge>/<subtype>[/<group>]/<stem>"
    example:
    - ai_context_files/instructions/how_tos/instr_operational_handoff
    - ai_context_files/knowledge/specs/spec_session_identity
    - ai_context_files/knowledge/reference/ref_tools_manifest

  _registry:
    required: false
    description: Registry metadata (populated/maintained by the traits registry scan).
    fields:
      id: {type: string}
      name: {type: string}
      status: {type: string, description: "active | draft | deprecated | retired"}
      version: {type: string}
      created: {type: date}
      updated: {type: date}

example_role:
  name: Condenser
  description: Authors operational-handoff briefs. Used in place of librarian on brief-author launches.
  responsibilities:
    duties: []
    ownership:
    - Operational-handoff brief authoring
    does_not_own:
    - Chat-history and exported-chat condensation (librarian domain)
  context_files:
  - ai_context_files/instructions/how_tos/instr_operational_handoff
  - ai_context_files/knowledge/specs/spec_session_identity
  - ai_context_files/knowledge/reference/ref_tools_manifest
  _registry:
    id: condenser
    name: Condenser
    status: active
    version: 1.0.0

loading_behavior: |
  Two consumers, now unified on the context_files key:
  - guidance_lib.assemble_role (knowledge MCP get_role): flattens context_files
    (list or mapping values) and inlines each file's latest content.
  - lib_cli_common.get_role_context_files (CLI-agent launch, system-prompt
    injection): reads the same flat context_files list.
  All referenced files load when the role loads. No tiers; no demand/topic gating.
