## Core Principle

Write observations immediately. Curate later.

## Philosophy

- **not_checkpoints**: write as insight occurs, don't wait for session end
- **append_only**: add entries, don't rewrite files
- **self_defined**: manifest defines slot purposes, evolve as needed
- **shared**: all AI participants read/write the same location

## Location

```
ai_memories/80_working_memory/
  manifest.yml        ← read this first — slot purposes + load tiers (authoritative)
  03.yml              ← user model
  04.yml              ← communication patterns
  05.yml              ← tool/pattern discoveries
  06.yml              ← current context
  07.yml              ← limitations & workarounds
  08.yml              ← learnings
  09.yml              ← cross-AI notes
  10.yml              ← project history
  11.yml              ← novel phrasing / originality evidence
```

The list above mirrors `manifest.yml`; the manifest is authoritative if they ever diverge.

## Entry Format

```yaml
- {ts: 2026-03-16T14:30:00Z, content: "brief observation"}
```

Full form when needed:
```yaml
- ts: 2026-03-16T14:30:00Z
  type: learning | observation | pattern | shortcut | issue
  content: "the insight"
  context: "what prompted this"
  reads: 0
```

This is the *stored* shape — the memory tools produce it for you. You do not hand-write it.

## Write / Read Paths

Use the **knowledge MCP memory tools** — do **not** hand-edit the slot `.yml` files. The tools own timestamping, append-only semantics, and load-tracking; a direct file edit bypasses all of that and is not the supported path.

| Operation | Tool |
|---|---|
| Write an observation | `knowledge_memory_append(slot, content)` |
| Read a slot | `knowledge_memory_read(slot, …)` — filter with `since` / `limit` |
| Search across slots | `knowledge_memory_search(query, …)` |
| Curate an entry | `knowledge_memory_update(slot, index, content)` |
| Remove / prune | `knowledge_memory_delete(slot, …)` |
| Slot counts & sizes | `knowledge_memory_stats()` |

(The tools target the shared `ai_memories/80_working_memory/` slots directly — a raw-file fallback is only for when the knowledge MCP is unavailable.)

## What to Log

- patterns discovered, shortcuts learned, mistakes to avoid
- user preferences not in docs, decisions with rationale
- cross-AI coordination notes, process improvements
- questions worth revisiting later

## Cross-Reference

- **Allowed**: read any AI's slots (`knowledge_memory_read` with the target `--ai`)
- **Never**: write to another AI's declared slot unilaterally
- Use the comms MCP to pass information to other AIs

## Full Protocol

See the companion `instr_memory_slot_protocol` for slot lifecycle and load tiers.
