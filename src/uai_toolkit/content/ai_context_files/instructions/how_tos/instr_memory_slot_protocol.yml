## Overview

The working memory system provides persistent, shared memory for all AI participants
in ai_root. Memory survives across sessions and is accessible to every AI through the
**knowledge MCP memory tools** (`knowledge_memory_*`).

**One source of truth:** `ai_memories/80_working_memory/`

All AIs read the manifest to understand slot purposes. All AIs append entries as
insights occur. No AI writes to another AI's dedicated slot without coordination.

---

## Directory Structure

```
ai_memories/80_working_memory/
├── manifest.yml          # Slot registry — what each slot is for
├── 01.yml                # Ecosystem registry pointer (reserved)
├── 03.yml                # User model
├── 04.yml                # Communication patterns
├── 05.yml                # Tool/pattern discoveries
├── 06.yml                # Current context notes
├── 07.yml                # Limitations & workarounds
├── 08.yml                # Learnings worth preserving
├── 09.yml                # Cross-AI notes
├── 10.yml                # Project history
├── 11.yml                # Novel phrasing / originality evidence
└── _archive_20251213/    # Historical entries
```

Slots 12–27 are reserved for expansion. Any AI may claim one — declare it in
`manifest.yml` first.


---

## Reading Memory

Read slots through the **knowledge MCP** — do not open the `.yml` files by hand:

```
knowledge_memory_read(slot=NN, since=…, limit=…)   # one slot, optionally filtered
knowledge_memory_search(query=…, slots=[…])         # search across slots
knowledge_memory_stats()                            # counts + sizes per slot
knowledge_get_manifest()                            # slot purposes + load tiers
```

**At session start:**
1. `knowledge_get_manifest()` — understand what each slot is for
2. Load AUTO-tier slots (03, 04, 05, 06 minimum)
3. Load TOPIC slots as conversation triggers arise
4. Load DEMAND slots only when explicitly needed

---

## Writing Memory

Write observations **immediately as insights occur** — never batch or checkpoint —
using `knowledge_memory_append`:

```
knowledge_memory_append(slot=NN, content="observation text")
```

The tool stamps the entry and preserves append-only order. The stored shape (which
the tool produces — you never write it by hand) is:

```yaml
- ts: 2026-03-16T14:30:00Z
  type: learning | observation | pattern | shortcut | issue
  content: "the insight"
  context: "optional — what prompted this"
  reads: 0
```

To revise or prune, use `knowledge_memory_update(slot, index, content)` and
`knowledge_memory_delete(slot, …)`. `reads` marks re-read value: high reads = keep,
zero reads after time = archive candidate.

Only fall back to editing a slot file directly if the knowledge MCP is unavailable.

---

## What to Log

**Always log:**
- User preferences not already in documentation
- Decisions made with rationale
- Workarounds discovered
- Tool behaviours confirmed through use
- Patterns that worked (or failed)
- Insights about the relationship or communication style

**Log if likely to matter later:**
- Project state worth carrying forward
- Open questions to revisit
- Cross-AI coordination notes

**Never log:**
- Transient session details
- Info already in documentation
- Sensitive data (tokens, passwords, personal data)
- Task-specific details (those belong in task result files)

